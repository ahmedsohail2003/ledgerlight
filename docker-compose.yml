services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ledgerlight
      MYSQL_USER: ledgerlight
      MYSQL_PASSWORD: ${DB_PASSWORD:-ledgerlight_dev}
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
